{% extends "base.html" %}

{% block title %}Add Doctor{% endblock %}

{% block content %}

<div class="card">

    <h2>Add New Doctor</h2>

    <form
        method="POST"
        action="{{ url_for('doctors.create_doctor') }}"
    >

        <div class="form-group">

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter doctor name"
                required
            >

        </div>


        <div class="form-group">

            <label for="specialization">
                Specialization:
            </label>

            <input
                type="text"
                id="specialization"
                name="specialization"
                placeholder="Enter specialization"
                required
            >

        </div>


        <div class="btn-container">

            <button type="submit">
                Add Doctor
            </button>

        </div>

    </form>


    <div class="action-links">

        <a href="{{ url_for('doctors.get_doctors') }}">
            Back to Doctors
        </a>

    </div>

</div>

{% endblock %}
