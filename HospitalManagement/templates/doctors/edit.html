{% extends "base.html" %}

{% block title %}Edit Doctor{% endblock %}

{% block content %}

<div class="card">

    <h2>Edit Doctor</h2>

    <form
        method="POST"
        action="{{ url_for('doctors.update_doctor', id=doctor.id) }}"
    >

        <input
            type="hidden"
            name="_method"
            value="PUT"
        >

        <div class="form-group">

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ doctor.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="specialization">
                Specialization:
            </label>

            <input
                type="text"
                id="specialization"
                name="specialization"
                value="{{ doctor.specialization }}"
                required
            >

        </div>


        <div class="btn-container">

            <button type="submit">
                Update Doctor
            </button>

        </div>

    </form>


    <div class="action-links">

        <a href="{{ url_for('doctors.get_doctor', id=doctor.id) }}">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
