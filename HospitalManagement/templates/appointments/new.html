{% extends "base.html" %}

{% block title %}Add Appointment{% endblock %}

{% block content %}

<div class="card">

    <h2>Add New Appointment</h2>

    <form
        method="POST"
        action="{{ url_for('appointments.create_appointment') }}"
    >

        <div class="form-group">

            <label for="patient_id">
                Patient:
            </label>

            <select
                id="patient_id"
                name="patient_id"
                required
            >

                <option value="">
                    Select Patient
                </option>

                {% for patient in patients %}

                <option value="{{ patient.id }}">
                    {{ patient.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="doctor_id">
                Doctor:
            </label>

            <select
                id="doctor_id"
                name="doctor_id"
                required
            >

                <option value="">
                    Select Doctor
                </option>

                {% for doctor in doctors %}

                <option value="{{ doctor.id }}">
                    {{ doctor.name }} - {{ doctor.specialization }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="date">
                Appointment Date:
            </label>

            <input
                type="date"
                id="date"
                name="date"
                required
            >

        </div>


        <div class="form-group">

            <label for="diagnosis">
                Diagnosis:
            </label>

            <input
                type="text"
                id="diagnosis"
                name="diagnosis"
                placeholder="Enter diagnosis"
                required
            >

        </div>


        <div class="form-group">

            <label for="status">
                Status:
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option value="">
                    Select Status
                </option>

                <option value="Under Treatment">
                    Under Treatment
                </option>

                <option value="Recovered">
                    Recovered
                </option>

                <option value="Critical">
                    Critical
                </option>

            </select>

        </div>


        <div class="btn-container">

            <button type="submit">
                Add Appointment
            </button>

        </div>

    </form>


    <div class="action-links">

        <a href="{{ url_for('appointments.get_appointments') }}">
            Back to Appointments
        </a>

    </div>

</div>

{% endblock %}
