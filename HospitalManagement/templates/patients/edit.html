{% extends "base.html" %}

{% block title %}Edit Patient{% endblock %}

{% block content %}

<div class="card">

    <h2>Edit Patient</h2>

    <form
        method="POST"
        action="{{ url_for('patients.update_patient', id=patient.id) }}"
    >

        <input
            type="hidden"
            name="_method"
            value="PUT"
        >


        <div class="form-group">

            <label for="name">
                Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ patient.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="age">
                Age:
            </label>

            <input
                type="number"
                id="age"
                name="age"
                value="{{ patient.age }}"
                min="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="gender">
                Gender:
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option
                    value="Male"
                    {% if patient.gender == "Male" %}
                        selected
                    {% endif %}
                >
                    Male
                </option>

                <option
                    value="Female"
                    {% if patient.gender == "Female" %}
                        selected
                    {% endif %}
                >
                    Female
                </option>

                <option
                    value="Other"
                    {% if patient.gender == "Other" %}
                        selected
                    {% endif %}
                >
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="contact">
                Contact:
            </label>

            <input
                type="text"
                id="contact"
                name="contact"
                value="{{ patient.contact }}"
                required
            >

        </div>


        <div class="btn-container">

            <button type="submit">
                Update Patient
            </button>

        </div>

    </form>


    <div class="action-links">

        <a href="{{ url_for('patients.get_patient', id=patient.id) }}">
            Cancel
        </a>

    </div>

</div>

{% endblock %}
