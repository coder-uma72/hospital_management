{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="card login-card">

    <h2>Admin Login</h2>

    <p class="login-description">
        Login to access the Hospital Management System
    </p>

    <form
        method="POST"
        action="{{ url_for('auth.login') }}"
    >

        <div class="form-group">

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>


        <div class="btn-container">

            <button type="submit">
                Login
            </button>

        </div>

    </form>

</div>

{% endblock %}
